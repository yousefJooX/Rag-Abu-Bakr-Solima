[project]
name = "mini-rag"
version = "0.1.0"
description = "Minimal RAG (Retrieval-Augmented Generation) API built with FastAPI — following Abu Bakr Soliman's mini-rag course."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.143.1",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "pydantic-settings>=2.16.0",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
